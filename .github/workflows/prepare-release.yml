name: Prepare release artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label embedded in the binaries and artifact names
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make release-prep VERSION="$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: spectide-${{ inputs.version }}-macos-linux
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
