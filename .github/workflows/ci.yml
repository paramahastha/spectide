name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: gofmt -d cmd internal | (! grep .)
      - run: go vet ./...
      - run: go test ./...
      - run: make build
      - run: ./bin/spectide demo --project ./examples/fake-provider-demo
