openapi: 3.1.0
info:
  title: SpecTide Local API
  version: 0.1.0-dev
  description: Loopback-only API for local runs, profiles, projects, and event replay.
servers:
  - url: http://127.0.0.1
paths:
  /api/v1/healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Local service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  local_only: { type: boolean, const: true }
  /api/v1/readyz:
    get:
      operationId: readiness
      responses:
        '200': { description: Local service readiness }
  /api/v1/version:
    get:
      operationId: version
      responses:
        '200': { description: Version and provider readiness }
  /api/v1/runs:
    get:
      operationId: listRuns
      responses:
        '200': { description: Persisted local runs }
    post:
      operationId: createRunOrPreview
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
        - in: header
          name: X-SpecTide-CSRF
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, prompt]
              additionalProperties: false
              properties:
                project: { type: string, minLength: 1 }
                prompt: { type: string, minLength: 1 }
                dry_run: { type: boolean, default: false }
      responses:
        '200': { description: Existing idempotent run or dry-run route preview }
        '202': { description: Run accepted, including durable blocked outcomes }
        '400': { description: Invalid request }
        '422': { description: Route or project rejected }
  /api/v1/runs/{id}:
    get:
      operationId: getRunReport
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Persisted run and evidence snapshot }
        '404': { description: Run not found }
  /api/v1/runs/{id}/report:
    get:
      operationId: getRunReportDocument
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Persisted report snapshot }
  /api/v1/runs/{id}/events:
    get:
      operationId: streamRunEvents
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: after, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Ordered server-sent event stream
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/runs/{id}/{action}:
    post:
      operationId: controlRun
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - in: path
          name: action
          required: true
          schema: { type: string, enum: [pause, resume, cancel] }
        - { in: header, name: X-SpecTide-CSRF, required: true, schema: { type: string } }
      responses:
        '202': { description: Control request accepted }
        '409': { description: Control not permitted in the current run state }
  /api/v1/runs/{id}/approvals:
    post:
      operationId: createApproval
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: X-SpecTide-CSRF, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, minLength: 1 }
      responses:
        '201': { description: Pending approval created }
        '404': { description: Run not found }
        '422': { description: Approval rejected }
  /api/v1/runs/{id}/approvals/{approvalId}:
    post:
      operationId: resolveApproval
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: approvalId, required: true, schema: { type: string } }
        - { in: header, name: X-SpecTide-CSRF, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, DENIED] }
      responses:
        '200': { description: Approval resolved }
        '409': { description: Approval was already resolved or invalid }
  /api/v1/profiles:
    get:
      operationId: listProfiles
      responses:
        '200': { description: Stored local profiles without credentials }
    post:
      operationId: saveProfile
      parameters:
        - { in: header, name: X-SpecTide-CSRF, required: true, schema: { type: string } }
      responses:
        '201': { description: Profile saved }
        '422': { description: Profile rejected }
  /api/v1/projects:
    get:
      operationId: listProjects
      responses:
        '200': { description: Registered canonical local projects }
    post:
      operationId: registerProject
      parameters:
        - { in: header, name: X-SpecTide-CSRF, required: true, schema: { type: string } }
      responses:
        '201': { description: Project registered }
        '422': { description: Project path rejected }
  /api/v1/projects/{id}/config:
    get:
      operationId: getProjectConfig
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Effective non-secret configuration }
        '403': { description: Canonical path or config boundary changed }
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
